[package]
name = "rjb"
version = "1.2.2"
edition = "2021"
license = "GPL-2.0-or-later"
description = "rJb : contrôle RGB unifié et léger pour tous vos périphériques et composants"

[[bin]]
name = "rJb"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
tray-icon = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_System_Com",
    "Win32_UI_HiDpi",
    "Win32_UI_Controls_Dialogs",
    "Win32_System_Diagnostics_ToolHelp",
] }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
