# Construit l'installateur Windows sur les serveurs de GitHub :
#  - à chaque envoi sur main : vérification de la compilation (installateur téléchargeable dans l'onglet Actions) ;
#  - à chaque publication d'une version (Release) : l'installateur et son empreinte SHA-256 y sont ajoutés.
name: Windows

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installateur:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust (stable, MSVC)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Tests de sécurité de l'installation (données temporaires)
        run: cargo test --locked --manifest-path tests/install-security/Cargo.toml

      - name: Tests Windows (ACL, chemins système, désinstallation)
        run: cargo test --locked --target x86_64-pc-windows-msvc

      - name: Compilation et contrôles (chemins, identifiants, Runtime Visual C++)
        run: ./tools/release.ps1 -Out dist -Ci

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rJb-Setup
          path: dist/*

  publication:
    if: github.event_name == 'release'
    needs: installateur
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rJb-Setup
          path: dist
      - name: Ajout des fichiers vérifiés à la version publiée
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload --repo "$env:GITHUB_REPOSITORY" --clobber -- "$env:RELEASE_TAG" dist/rJb-Setup.exe dist/SHA256SUMS.txt
