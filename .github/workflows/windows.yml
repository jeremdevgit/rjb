# Construit l'installateur Windows sur les serveurs de GitHub :
#  - à chaque envoi sur main : vérification de la compilation (installateur téléchargeable dans l'onglet Actions) ;
#  - à chaque publication d'une version (Release) : l'installateur et son empreinte SHA-256 y sont ajoutés.
name: Windows

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installateur:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Rust (stable, MSVC)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Tests de sécurité de l'installation (données temporaires)
        run: cargo test --locked --manifest-path tests/install-security/Cargo.toml

      - name: Compilation et contrôles (chemins, identifiants, Runtime Visual C++)
        run: ./tools/release.ps1 -Out dist -Ci

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rJb-Setup
          path: dist/*

  publication:
    if: github.event_name == 'release'
    needs: installateur
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rJb-Setup
          path: dist
      - name: Ajout des fichiers vérifiés à la version publiée
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload --repo "$env:GITHUB_REPOSITORY" --clobber -- "$env:RELEASE_TAG" dist/rJb-Setup.exe dist/SHA256SUMS.txt
